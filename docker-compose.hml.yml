services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos_ia_mvp_next_hml
    restart: unless-stopped
    command: ["sh", "-lc", "php /var/www/html/academic_hml_smoke.php && apache2-foreground"]
    ports:
      - "127.0.0.1:8892:80"
    environment:
      APP_ENV: homologation
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cursos_ia_mvp
      DB_USERNAME: cursos_ia
      DB_PASSWORD: cursos_ia_hml
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cursos_ia_next_hml
      - vitrine_net

  db:
    image: mariadb:11.4
    container_name: cursos_ia_mvp_next_db_hml
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cursos_ia_mvp
      MARIADB_USER: cursos_ia
      MARIADB_PASSWORD: cursos_ia_hml
      MARIADB_ROOT_PASSWORD: cursos_ia_root_hml
    volumes:
      - ../shared/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cursos_ia_next_hml

networks:
  cursos_ia_next_hml:
    driver: bridge
  vitrine_net:
    external: true
    name: vitrine_net
