services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos_ia_mvp_hml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8894:80"
    environment:
      APP_ENV: homologation
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cursos_ia_mvp
      DB_USERNAME: cursos_ia
      DB_PASSWORD: cursos_ia_hml
      AI_ENABLED: "1"
      AI_MODE: broker
      AI_PROJECT_ID: cursos-ia-mvp
      AI_BROKER_URL: http://vitrine_core_web_hml/api/internal/centro-ia/execute
      AI_BROKER_TOKEN: ${AI_BROKER_TOKEN:?AI_BROKER_TOKEN is required}
      AI_API_URL: ""
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ""
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cursos_ia_hml
      - vitrine_net

  db:
    image: mariadb:11.4
    container_name: cursos_ia_mvp_db_hml
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cursos_ia_mvp
      MARIADB_USER: cursos_ia
      MARIADB_PASSWORD: cursos_ia_hml
      MARIADB_ROOT_PASSWORD: cursos_ia_root_hml
    volumes:
      - ../shared/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cursos_ia_hml

networks:
  cursos_ia_hml:
    driver: bridge
  vitrine_net:
    external: true
    name: vitrine_net
