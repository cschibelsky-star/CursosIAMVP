services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos_ia_mvp_app_hml
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ../shared/uploads:/var/www/html/storage/app/public
      - ../shared/logs:/var/www/html/storage/logs
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cursos_ia_mvp
      DB_USERNAME: cursos_ia
      DB_PASSWORD: cursos_ia_hml_change_me
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cursos_ia_hml

  web:
    image: nginx:1.27-alpine
    container_name: cursos_ia_mvp_web_hml
    restart: unless-stopped
    ports:
      - "8510:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cursos_ia_hml

  db:
    image: mariadb:11.4
    container_name: cursos_ia_mvp_db_hml
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cursos_ia_mvp
      MARIADB_USER: cursos_ia
      MARIADB_PASSWORD: cursos_ia_hml_change_me
      MARIADB_ROOT_PASSWORD: cursos_ia_root_hml_change_me
    volumes:
      - cursos_ia_mvp_db_hml:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cursos_ia_hml

  redis:
    image: redis:7.4-alpine
    container_name: cursos_ia_mvp_redis_hml
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - cursos_ia_mvp_redis_hml:/data
    networks:
      - cursos_ia_hml

volumes:
  cursos_ia_mvp_db_hml:
  cursos_ia_mvp_redis_hml:

networks:
  cursos_ia_hml:
    name: cursos_ia_mvp_hml
