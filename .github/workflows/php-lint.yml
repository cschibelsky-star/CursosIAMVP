name: PHP Lint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP syntax check
        shell: sh
        run: |
          set -eu
          find public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
