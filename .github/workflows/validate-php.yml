name: Validate PHP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Reject committed environment and key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key)$' >/dev/null; then
            echo 'Forbidden environment/key file committed.'
            exit 1
          fi

      - name: Lint changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed PHP files.'
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          for file in "${files[@]}"; do
            php -l "$file"
          done
