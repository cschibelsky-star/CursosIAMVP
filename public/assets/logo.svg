<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Símbolo / Ícone: Cap Acadêmico estilizado com Redes Neurais / Conexões de IA -->
  <g transform="translate(8, 8)">
    <!-- Círculo de fundo brilhante -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#1e1b4b" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" />

    <!-- Capelo / Cap Estilizado -->
    <path d="M24 12 L38 18 L24 24 L10 18 Z" fill="url(#gradBrand)" />
    <path d="M15 21 L15 28 C15 32 33 32 33 28 L33 21" fill="none" stroke="url(#gradAccent)" stroke-width="2" stroke-linecap="round" />

    <!-- Ponto neural / Conexão IA -->
    <circle cx="38" cy="22" r="2" fill="#06b6d4" filter="url(#glow)" />
    <path d="M38 18 L38 28" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="24" cy="18" r="2.5" fill="#ffffff" />
  </g>

  <!-- Tipografia / Nome da Plataforma -->
  <g transform="translate(68, 22)">
    <text x="0" y="12" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Cursos <tspan fill="url(#gradBrand)">IA</tspan>
    </text>
    <text x="0" y="26" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      VITRINE IA PRO · EAD
    </text>
  </g>
</svg>
